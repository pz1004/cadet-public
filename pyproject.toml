[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadet-rl"
version = "0.1.0"
description = "CADET streaming nonparametric change detection for non-stationary reinforcement learning streams."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
mujoco = [
  "gymnasium[mujoco]>=1.2",
]

[tool.setuptools.packages.find]
include = ["cadet*"]
exclude = ["results*", "tests*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
